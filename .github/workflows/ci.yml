name: Extension checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/*.test.cjs
      - run: for f in extension/*.js; do node --check "$f" || exit 1; done
      - run: node -e "JSON.parse(require('fs').readFileSync('extension/manifest.json','utf8'))"
      - run: cd extension && zip -r ../inktrail-extension.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: inktrail-extension
          path: inktrail-extension.zip

  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save --ignore-scripts playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: node --test tests/browser-smoke.cjs
