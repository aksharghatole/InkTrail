<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>InkTrail</title><link rel="stylesheet" href="popup.css"></head><body>
<header><div class="mark">IT</div><div><h1>InkTrail</h1><p>Every chapter. Never lose your place.</p></div></header>
<section><strong id="site">Checking current site…</strong><button id="toggle" disabled>Enable tracking</button><p id="status" role="status">Tracking is opt-in by website.</p><details class="manual"><summary>Save this chapter manually</summary><form id="manualForm"><label for="manualTitle">Series title</label><input id="manualTitle" maxlength="180" required placeholder="Manga title"><label for="manualChapter">Chapter number</label><input id="manualChapter" inputmode="decimal" required placeholder="12.5"><label class="check"><input type="checkbox" id="manualRead"> Mark as read</label><button id="manualSave" type="submit" disabled>Save chapter</button></form></details></section>
<div class="toolbar"><h2>Library <span id="count"></span></h2><a href="library.html" target="_blank">Manage library</a><button id="export">Export</button></div><input id="search" type="search" placeholder="Find a series" aria-label="Find a series"><main id="library" aria-live="polite"></main><a href="releases.html" target="_blank">Release tracker</a><footer>Local only · No account · No analytics</footer><script src="core.js"></script><script src="popup.js"></script></body></html>
